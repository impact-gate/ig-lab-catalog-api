openapi: 3.0.3
info:
  title: Catalog API
  version: 1.0.0
  description: Product catalog, inventory, and pricing service
paths:
  /v1/products:
    get:
      summary: List products
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: category
          in: query
          schema: { type: string }
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: object
                required: [products, total, page]
                properties:
                  total: { type: integer }
                  page: { type: integer }
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
    post:
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

  /v1/products/{id}:
    get:
      summary: Get product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found
    put:
      summary: Update product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
    delete:
      summary: Delete product
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Deleted successfully

  /v1/categories:
    get:
      summary: List product categories
      responses:
        '200':
          description: Categories list
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories:
                    type: array
                    items:
                      type: object
                      required: [id, name, slug]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        slug: { type: string }
                        parentId: { type: string, nullable: true }

  /v1/inventory/{productId}:
    get:
      summary: Get inventory status for a product
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Inventory status
          content:
            application/json:
              schema:
                type: object
                required: [productId, quantity, inStock, warehouseLocations]
                properties:
                  productId: { type: string }
                  quantity: { type: integer }
                  inStock: { type: boolean }
                  warehouseLocations:
                    type: array
                    items: { type: string }
                  restockLeadDays: { type: integer, nullable: true }

  /v1/pricing/{productId}:
    get:
      summary: Get pricing calculation for a product
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
        - name: currency
          in: query
          schema: { type: string, default: USD }
      responses:
        '200':
          description: Pricing details
          content:
            application/json:
              schema:
                type: object
                required: [productId, basePriceCents, currency, discountPercent, effectivePriceCents]
                properties:
                  productId: { type: string }
                  basePriceCents: { type: integer }
                  currency: { type: string, enum: [USD, EUR, GBP] }
                  discountPercent: { type: number }
                  effectivePriceCents: { type: integer }

components:
  schemas:
    Product:
      type: object
      required: [id, name, priceCents, categoryId, status]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        priceCents: { type: integer }
        categoryId: { type: string }
        status: { type: string, enum: [active, draft, archived] }
        tags:
          type: array
          items: { type: string }
        inventory:
          type: object
          required: [inStock, quantity]
          properties:
            inStock: { type: boolean }
            quantity: { type: integer }
            leadDays: { type: integer, nullable: true }

    CreateProductRequest:
      type: object
      required: [name, priceCents, categoryId]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        priceCents: { type: integer }
        categoryId: { type: string }
        tags:
          type: array
          items: { type: string }

    UpdateProductRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        priceCents: { type: integer }
        status: { type: string, enum: [active, draft, archived] }
